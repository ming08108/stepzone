name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      # Compile the production app/functions and reject stale committed API bundles.
      - run: npm run build:check
      # Drives the real app in the runner's system Chrome (playwright-core,
      # no bundled browsers). Gameplay legs self-skip if WebGPU is absent.
      - run: npm run e2e
